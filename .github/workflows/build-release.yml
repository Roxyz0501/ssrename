name: Build, test, and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2

      - name: Download official ACT build reference
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actRoot = Join-Path $env:RUNNER_TEMP 'act'
          $actZip = Join-Path $env:RUNNER_TEMP 'ACTv3.zip'
          Invoke-WebRequest -Uri 'https://advancedcombattracker.com/download.php?id=57' -OutFile $actZip
          Expand-Archive -LiteralPath $actZip -DestinationPath $actRoot
          $actExe = Get-ChildItem -LiteralPath $actRoot -Filter 'Advanced Combat Tracker.exe' -Recurse | Select-Object -First 1
          if ($null -eq $actExe) { throw 'Advanced Combat Tracker.exe was not found in the official archive.' }
          "ACT_PATH=$($actExe.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        shell: pwsh
        run: dotnet msbuild SSRename.sln -t:Rebuild -p:Configuration=Release "-p:ACTPath=$env:ACT_PATH" -v:minimal

      - name: Test
        shell: pwsh
        run: .\tests\SSRename.Tests\bin\Release\SSRename.Tests.exe

      - name: Validate tag and create release package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Release tags must use vX.Y.Z.' }
          .\tools\New-ReleasePackage.ps1 -Version $version -ACTPath $env:ACT_PATH

      - name: Upload verified release files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7.0.0
        with:
          name: release-files
          path: |
            release/SSRename-*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@v7.0.0
        with:
          name: release-files
          path: release

      - name: Create stable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archives = @(Get-ChildItem -LiteralPath release -Filter 'SSRename-*.zip')
          if ($archives.Count -ne 1) { throw "Expected one release archive, found $($archives.Count)." }
          $archive = $archives[0].FullName
          $manifest = (Resolve-Path -LiteralPath 'release/SHA256SUMS.txt').Path
          gh release create $env:GITHUB_REF_NAME $archive $manifest --repo $env:GITHUB_REPOSITORY --verify-tag --title "SSRename $env:GITHUB_REF_NAME" --generate-notes
